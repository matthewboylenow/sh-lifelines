<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LifeLines">
  <!-- A life ring, in the parish navy and teal. Kept to two thick concentric
       shapes and four blocks so it still reads at 16 pixels. -->
  <rect width="64" height="64" rx="14" fill="#1f346d" />
  <circle cx="32" cy="32" r="19" fill="none" stroke="#ffffff" stroke-width="9" />
  <g fill="#019e7c">
    <rect x="28" y="7" width="8" height="12" rx="2" />
    <rect x="28" y="45" width="8" height="12" rx="2" />
    <rect x="7" y="28" width="12" height="8" rx="2" />
    <rect x="45" y="28" width="12" height="8" rx="2" />
  </g>
</svg>
